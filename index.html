<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>File Downloads</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="miniapps.css">
    <link href="css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <script src="twkhelper/twkhelper.js"></script>
    <script src="constants.js"></script>
    <script src="js/pdf.min.js"></script>
    <script src="js/mermaid.min.js"></script>

    <script>
        // Initialize Mermaid globally
        mermaid.initialize({
            startOnLoad: false,
            theme: 'base',

                curve: 'basis',

                htmlLabels: true

</head>

<body class="bg-light">
    <div id="pull-to-refresh">
        <div class="pull-to-refresh-container">
            <div class="pull-spinner"></div>
        </div>
    </div>
    <div class="header-container">
        <h2 id="title" class="text-center mb-1"></h2>
        <button class="toggle-btn" onclick="toggleSidebar()" aria-label="Toggle Sidebar"><i class="fa-solid fa-ellipsis"
                style="color: rgb(255, 255, 255);"></i></button>
    </div>
    <div class="sidebar" id="sidebar" tabindex="-1">
        <ul>
            <li id="mode-default" tabindex="0" onclick="setMode('default')" onkeydown="handleKeydown(event, 'default')"
                aria-label="Default Mode">
                <i class="fas fa-home"></i> <span></span>
            </li>
            <li id="mode-grayscale" tabindex="0" onclick="setMode('grayscale')"
                onkeydown="handleKeydown(event, 'grayscale')" aria-label="Grayscale Mode">
                <i class="fas fa-adjust"></i> <span></span>
            </li>
            <li id="mode-light" tabindex="0" onclick="setMode('light')" onkeydown="handleKeydown(event, 'light')"
                aria-label="Light Mode">
                <i class="fas fa-sun"></i> <span></span>
            </li>
            <li id="mode-dark" tabindex="0" onclick="setMode('dark')" onkeydown="handleKeydown(event, 'dark')"
                aria-label="Dark Mode">
                <i class="fas fa-moon"></i> <span></span>
            </li>
            <li id="language-switcher" tabindex="0" onclick="toggleLanguage()"
                onkeydown="handleKeydown(event, 'language')" aria-label="Toggle Language">
                <i class="fas fa-globe"></i> <span></span>
            </li>
            <li id="size-increase" tabindex="0" onclick="increaseSize()"
                onkeydown="handleKeydown(event, 'size-increase')" aria-label="Increase Size">
                <i class="fas fa-plus"></i> <span></span>
            </li>
            <li id="size-decrease" tabindex="0" onclick="decreaseSize()"
                onkeydown="handleKeydown(event, 'size-decrease')" aria-label="Decrease Size">
                <i class="fas fa-minus"></i> <span></span>
            </li>
            <li id="size-reset" tabindex="0" onclick="resetSize()" onkeydown="handleKeydown(event, 'size-reset')"
                aria-label="Reset Size">
                <i class="fas fa-redo"></i> <span></span>
            </li>
        </ul>
    </div>
    <div id="overlay" class="overlay" onclick="toggleSidebar()"></div>

    <main class="container py-4">

        <div class="controls-bar">
            <div class="search-container">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="search-input" onkeyup="filterRoadmaps()" placeholder="Search careers...">
                <i class="fas fa-times-circle clear-search-icon" id="clear-search" onclick="clearSearchInput()"
                    style="display: none;"></i>
            </div>
            <div class="category-filters" id="category-filters">
                <button class="filter-btn active" data-category="all" onclick="setCategory('all')">All</button>
                <button class="filter-btn" data-category="software" onclick="setCategory('software')">Software</button>
                <button class="filter-btn" data-category="ai" onclick="setCategory('ai')">Artificial
                    Intelligence</button>
                <button class="filter-btn" data-category="security" onclick="setCategory('security')">Security</button>
            </div>
        </div>

        <div id="roadmaps-container" class="roadmaps-grid"></div>
        <div id="roadmap-detail" class="roadmap-detail d-none"></div>

    </main>

    <footer>
        <p>
            <span id="copyright-ar">جميع الحقوق محفوظة © جامعة الباحة 2025.</span>
            <span id="copyright-en" style="display: none;">All rights reserved © Albaha University 2025.</span>
        </p>
    </footer>

    <div id="loader-overlay">
        <div class="spinner"></div>
    </div>

    <script>
        async function downloadDiagram(roadmapId) {
            const targetElement = document.querySelector('.roadmap-diagram-wrapper');

            if (!targetElement) {
                console.error("Diagram not found.");
                return;
            }

            // Show a temporary loading state on the button
            const btn = document.getElementById('dl-btn-icon');
            if (btn) btn.className = 'fas fa-spinner fa-spin';

            try {
                // Using html-to-image to bypass rendering bugs
                const dataUrl = await htmlToImage.toPng(targetElement, {
                    pixelRatio: 2, // 2x resolution for crisp text
                    backgroundColor: document.body.classList.contains('dark-mode') ? '#1e293b' : '#ffffff',
                    style: {
                        transform: 'scale(1)',
                        transformOrigin: 'top left'
                    }
                });

                // Convert to a downloadable PNG file
                const link = document.createElement("a");
                const fileName = roadmapId ? roadmapId : "roadmap";
                link.download = `${fileName}.png`;
                link.href = dataUrl;

                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } catch (error) {
                console.error("Failed to download image:", error);
                alert(isArabic ? 'فشل تحميل الصورة' : 'Failed to download image');
            } finally {
                // Restore button icon
                if (btn) btn.className = 'fas fa-image';
            }
        }



        function generateNativeRoadmap(roadmap, isArabic) {
            let html = `<div class="rn-container">
                            <div class="rn-spine"></div>`;

            const rootTitle = isArabic ? roadmap.title_ar : roadmap.title_en;
            html += `<div class="rn-root">${sanitizeHTML(rootTitle)}</div>`;

            if (roadmap.steps && Array.isArray(roadmap.steps)) {
                roadmap.steps.forEach((step, stepIndex) => {
                    const stepTitle = isArabic ? `مرحلة ${step.phase}: ${step.title_ar}` : `Phase ${step.phase}: ${step.title_en}`;

                    html += `<div class="rn-phase-container">
                                <div class="rn-phase">${sanitizeHTML(stepTitle)}</div>
                                <div class="rn-skills-wrapper">`;

                    if (step.skills && Array.isArray(step.skills)) {
                        step.skills.forEach((skill, skillIndex) => {
                            // Automatically alternate left and right sides
                            const sideClass = stepIndex % 2 === 0 ? 'rn-right' : 'rn-left';

                            const skillName = isArabic ? skill.name_ar : skill.name_en;
                            const reqClass = skill.required ? 'rn-req' : 'rn-opt';
                            const clickableClass = skill.link ? 'rn-clickable' : '';
                            const linkAttr = skill.link ? `onclick="window.open('${skill.link}', '_blank')"` : '';
                            const linkIcon = skill.link ? `<i class="fas fa-external-link-alt" style="margin-inline-start: 4px; opacity: 0.7; font-size: 0.8em;"></i>` : '';
                            const optText = !skill.required ? `<br><small style="opacity: 0.8; font-weight: normal;">${isArabic ? '(اختياري)' : '(Optional)'}</small>` : '';

                            html += `
                                <div class="rn-skill-row ${sideClass}">
                                    <div class="rn-branch"></div>
                                    <div class="rn-skill-box ${reqClass} ${clickableClass}" ${linkAttr}>
                                        ${sanitizeHTML(skillName)}${linkIcon}${optText}
                                    </div>
                                </div>`;
                        });
                    }
                    html += `</div></div>`;
                });
            }
            html += `</div>`;
            return html;
        }

        async function renderRoadmapDetail(roadmap) {
            currentActiveRoadmap = roadmap; // <-- Memorize the open roadmap

            const detail = document.getElementById('roadmap-detail');
            if (!detail) return;

            const title = isArabic ? roadmap.title_ar : roadmap.title_en;

            // Look for a detailed description first. If it's missing, use the short one.
            const shortDesc = isArabic ? roadmap.description_ar : roadmap.description_en;
            const longDesc = isArabic ? roadmap.detailed_desc_ar : roadmap.detailed_desc_en;
            const desc = longDesc ? longDesc : shortDesc;

            let html = `
            <div class="roadmap-detail-header">
                <div>
                    <div class="roadmap-detail-title">
                        <i class="fas ${roadmap.icon || 'fa-route'}" style="color:${roadmap.color || '#2196F3'}; margin-inline-end:.4rem;"></i>
                        ${sanitizeHTML(title)}
                    </div>
                    <div class="roadmap-detail-sub">${sanitizeHTML(desc)}</div>
                </div>
                <div>
                    <button class="btn btn-sm btn-outline-success" onclick="downloadDiagram('${roadmap.id}')" style="margin-inline-end:.5rem;">
                        <i id="dl-btn-icon" class="fas fa-image"></i> ${isArabic ? 'تحميل كصورة' : 'Save as Image'}
                    </button>
                    
                    ${roadmap.pdf ? `
                        <a href="${sanitizeHTML(roadmap.pdf)}" target="_blank" class="btn btn-sm btn-outline-primary" style="margin-inline-end:.5rem;">
                            <i class="fas fa-file-pdf"></i> ${isArabic ? 'تحميل كـ PDF' : 'Download PDF'}
                        </a>
                    ` : ''}
                    
                    <button class="roadmap-detail-close" onclick="document.getElementById('roadmap-detail').classList.add('d-none'); currentActiveRoadmap = null;">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>

            <div class="roadmap-diagram-wrapper" style="overflow-x: hidden; padding: 1rem 0; width: 100%;">
                ${generateNativeRoadmap(roadmap, isArabic)}
            </div>
            `;

            detail.innerHTML = html;
            detail.classList.remove('d-none');


            try {
                if (window.mermaid) {
                    await window.mermaid.run({
                        querySelector: '#mermaid-container'
                    });

                    // Give the browser 100 milliseconds to finish painting the SVG
                    setTimeout(() => {
                        const svgElement = document.querySelector('#mermaid-container svg');

                        if (svgElement && typeof panzoom !== 'undefined') {
                            // Override Mermaid's strict height/width limits
                            svgElement.style.maxWidth = 'none';
                            svgElement.style.width = '100%';
                            svgElement.style.height = 'auto';
                            svgElement.style.overflow = 'visible';

                            // Initialize Panzoom with looser restrictions
                            // Initialize Panzoom with strict boundaries
                            // Initialize Panzoom with strict, rigid behavior
                            panzoom(svgElement, {
                                maxZoom: 5,
                                minZoom: 1,          // Prevents the map from shrinking smaller than the screen
                                bounds: true,        // Locks the map inside strict walls
                                boundsPadding: 0,    // Kills the bouncy, "rubber-band" feeling
                                smoothScroll: false  // Removes the slippery sliding momentum
                            });

                            console.log("Panzoom successfully attached!");
                        } else {
                            console.warn("Could not attach Panzoom. SVG found:", !!svgElement, "Panzoom loaded:", typeof panzoom !== 'undefined');
                        }
                    }, 100); // 100ms delay
                }
            } catch (error) {
                console.error("Failed to render roadmap diagram:", error);
                document.getElementById('mermaid-container').innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
            }
        }
    </script>

    <script>
        // Global State Variables
        let allRoadmaps = [];
        let currentCategory = 'all';
        let currentActiveRoadmap = null;
        async function loadRoadmaps() {
            const container = document.getElementById('roadmaps-container');
            const detail = document.getElementById('roadmap-detail');
            container.innerHTML = '';
            detail.classList.add('d-none');
            detail.innerHTML = '';

            document.getElementById('loader-overlay').style.display = 'flex';

            try {
                const resp = await fetch('data/roadmaps.json');
                if (!resp.ok) throw new Error(isArabic ? 'فشل جلب المسارات' : 'Failed to fetch roadmaps');

                allRoadmaps = await resp.json();
                allRoadmaps.sort((a, b) => (a.display_order || 0) - (b.display_order || 0));

                // Call the filter function to render the initial state
                filterRoadmaps();
            } catch (e) {
                console.error(e);
                container.innerHTML = `<div class="alert alert-danger">${sanitizeHTML(isArabic ? e.message : e.message)}</div>`;
            } finally {
                document.getElementById('loader-overlay').style.display = 'none';
            }
        }

        function setCategory(category) {
            currentCategory = category;

            // Clear out the search input completely when swapping category tabs
            const searchInput = document.getElementById('search-input');
            if (searchInput) {
                searchInput.value = '';
            }

            // Update active UI state on buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.dataset.category === category) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            filterRoadmaps(); // This will automatically hide the "X" icon and show all cards in this category
        }
        function clearSearchInput() {
            const searchInput = document.getElementById('search-input');
            if (searchInput) {
                searchInput.value = '';
                searchInput.focus(); // Keeps the cursor active in the input box for convenience
            }
            filterRoadmaps(); // Forces the UI grid to reload instantly without text constraints
        }

        function filterRoadmaps() {
            const container = document.getElementById('roadmaps-container');
            const detailPanel = document.getElementById('roadmap-detail');
            const searchInput = document.getElementById('search-input');
            const searchTerm = searchInput.value.toLowerCase();
            const clearIcon = document.getElementById('clear-search');

            // Toggle visibility of the "X" icon based on text input
            if (clearIcon) {
                clearIcon.style.display = searchTerm.length > 0 ? 'block' : 'none';
            }

            // Rescue the detail panel by moving it back to the main container before wiping the grid
            document.querySelector('main.container').appendChild(detailPanel);

            // ... the rest of your original filter logic continues exactly the same ...

            container.innerHTML = '';

            // Hide details panel when searching/filtering
            document.getElementById('roadmap-detail').classList.add('d-none');

            // Filter the array based on search text AND selected category
            const filteredData = allRoadmaps.filter(rm => {
                const matchCategory = currentCategory === 'all' || rm.category === currentCategory;
                const searchTarget = isArabic ? (rm.title_ar || '') : (rm.title_en || '');
                const matchSearch = searchTarget.toLowerCase().includes(searchTerm);

                return matchCategory && matchSearch;
            });

            // Handle empty state (no matches)
            if (filteredData.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 3rem; color: #6c757d;">
                        <i class="fas fa-search fa-2x mb-2" style="opacity: 0.5;"></i>
                        <p>${isArabic ? 'لم يتم العثور على مسارات تطابق بحثك.' : 'No career paths match your search.'}</p>
                    </div>`;
                return;
            }

            // Draw the filtered cards
            filteredData.forEach((rm) => {
                const card = document.createElement('div');
                card.className = 'roadmap-card';
                const title = isArabic ? rm.title_ar : rm.title_en;
                const desc = isArabic ? rm.description_ar : rm.description_en;

                // Determine the difficulty level and colors
                const level = rm.level || 'beginner'; // Default fallback
                let levelTextEn, levelTextAr, levelClass;

                if (level === 'intermediate') {
                    levelTextEn = 'Intermediate'; levelTextAr = 'متوسط'; levelClass = 'level-intermediate';
                } else if (level === 'advanced') {
                    levelTextEn = 'Advanced'; levelTextAr = 'متقدم'; levelClass = 'level-advanced';
                } else {
                    levelTextEn = 'Beginner'; levelTextAr = 'مبتدئ'; levelClass = 'level-beginner';
                }

                const displayLevel = isArabic ? levelTextAr : levelTextEn;

                // Build the card HTML
                card.innerHTML = `
                    <div class="roadmap-card-title">
                        <i class="fas ${rm.icon || 'fa-route'} roadmap-card-icon" style="color:${rm.color || '#2196F3'}"></i>
                        <span>${sanitizeHTML(title)}</span>
                    </div>
                    <div class="roadmap-card-desc">${sanitizeHTML(desc)}</div>
                    
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 12px;">
                        <span class="roadmap-card-tag ${levelClass}">
                            ${displayLevel}
                        </span>
                        <i class="fas fa-chevron-down accordion-chevron"></i>
                    </div>
                `;

                // Accordion Click Interaction
                card.onclick = () => {
                    const detailPanel = document.getElementById('roadmap-detail');

                    // 1. TOGGLE OFF: If they click the card that is already open, close it.
                    if (card.classList.contains('active-roadmap')) {
                        card.classList.remove('active-roadmap');
                        detailPanel.classList.add('d-none');
                        currentActiveRoadmap = null;
                        return; // Stop the code here
                    }

                    // 2. RESET: Remove the highlight from all other cards
                    document.querySelectorAll('.roadmap-card').forEach(c => c.classList.remove('active-roadmap'));

                    // 3. HIGHLIGHT: Light up the new card
                    card.classList.add('active-roadmap');

                    // 4. INJECT: Physically move the detail panel to sit immediately after this card in the HTML
                    card.insertAdjacentElement('afterend', detailPanel);

                    // 5. RENDER: Draw the roadmap
                    renderRoadmapDetail(rm);

                    // 6. SCROLL: Automatically scroll the screen down slightly so the diagram is perfectly in view
                    setTimeout(() => {
                        detailPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }, 50);
                };

                // Accordion Keyboard Accessibility
                card.onkeydown = (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        card.click(); // Reuse the click logic above to keep code clean
                    }
                };
                card.tabIndex = 0;

                container.appendChild(card);
            });
        }
    </script>

    <script>
        let lang, isArabic;
        let currentMode = 'default';
        let sizeScale = 1;
        let touchStartY = null;
        let pullDistance = 0;
        const pullThreshold = 80;

        function waitForPdfJs() {
            return new Promise((resolve, reject) => {
                if (typeof pdfjsLib !== 'undefined') {
                    console.log("PDF.js is loaded.");
                    resolve();
                } else {
                    console.log("Waiting for PDF.js...");
                    const script = document.querySelector('script[src*="pdf.min.js"]');
                    if (script) {
                        script.onload = () => {
                            console.log("PDF.js loaded.");
                            resolve();
                        };
                        script.onerror = () => reject(new Error("PDF.js script failed to load"));
                    } else {
                        reject(new Error("PDF.js script not found"));
                    }
                }
            });
        }

        function sanitizeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str || '';
            return div.innerHTML;
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            const mainContainer = document.querySelector('main.container');
            const isOpen = sidebar.classList.toggle('active');
            overlay.classList.toggle('active', isOpen);
            document.body.classList.toggle('sidebar-active', isOpen);
            if (isOpen) {
                sidebar.focus();
                document.querySelectorAll('.sidebar ul li').forEach(item => item.classList.remove('active'));
            } else {
                document.querySelectorAll('.sidebar ul li').forEach(item => item.classList.remove('active'));
            }
        }

        function handleKeydown(event, action) {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                switch (action) {
                    case 'language':
                        toggleLanguage();
                        break;
                    case 'size-increase':
                        increaseSize();
                        break;
                    case 'size-decrease':
                        decreaseSize();
                        break;
                    case 'size-reset':
                        resetSize();
                        break;
                    default:
                        setMode(action);
                }
            }
        }

        async function setMode(mode, isUserAction = false) {
            if (mode === 'default') {
                try {
                    const device_info = await TWK.getDeviceInfo();
                    if (device_info.success) {
                        lang = ['ar', 'en'].includes(device_info.result.app_language) ? device_info.result.app_language : 'ar';
                        isArabic = lang === 'ar';
                        localStorage.setItem('language', lang);
                        document.documentElement.lang = lang;
                        document.documentElement.dir = isArabic ? 'rtl' : 'ltr';
                        const appearanceMode = device_info.result.appearance === 2 ? 'dark' : 'default';
                        localStorage.setItem('accessibilityMode', appearanceMode);
                        if (appearanceMode === 'dark') {
                            setMode('dark');
                        } else {
                            document.body.classList.remove('grayscale-mode', 'dark-mode', 'light-mode', 'bg-light', 'bg-dark');
                            document.querySelectorAll('.sidebar ul li').forEach(item => item.classList.remove('active'));
                            document.body.classList.add('bg-light');
                            document.getElementById(`mode-${mode}`).classList.add('active');
                            currentMode = mode;
                            localStorage.setItem('accessibilityMode', mode);
                            localStorage.setItem('darkMode', false);
                        }
                        updateLanguage();
                    } else {
                        lang = 'ar';
                        isArabic = true;
                        localStorage.setItem('language', lang);
                        localStorage.setItem('accessibilityMode', 'default');
                        document.body.classList.remove('grayscale-mode', 'dark-mode', 'light-mode', 'bg-light', 'bg-dark');
                        document.querySelectorAll('.sidebar ul li').forEach(item => item.classList.remove('active'));
                        document.body.classList.add('bg-light');
                        document.getElementById(`mode-default`).classList.add('active');
                        currentMode = 'default';
                        localStorage.setItem('darkMode', false);
                        document.documentElement.lang = lang;
                        document.documentElement.dir = isArabic ? 'rtl' : 'ltr';
                        updateLanguage();
                    }
                } catch (e) {
                    console.error('Failed to get device info in setMode, falling back to browser settings:', e);

                    // 1. Check if the browser or device is currently set to Dark Mode
                    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

                    lang = 'ar';
                    isArabic = true;
                    localStorage.setItem('language', lang);
                    localStorage.setItem('accessibilityMode', 'default');

                    // 2. Clear out any old background and mode classes
                    document.body.classList.remove('grayscale-mode', 'dark-mode', 'light-mode', 'bg-light', 'bg-dark');
                    document.querySelectorAll('.sidebar ul li').forEach(item => item.classList.remove('active'));

                    // 3. Apply Dark Mode if the browser prefers it, otherwise apply Light Mode
                    if (prefersDark) {
                        document.body.classList.add('dark-mode', 'bg-dark');
                        localStorage.setItem('darkMode', true);
                    } else {
                        document.body.classList.add('bg-light');
                        localStorage.setItem('darkMode', false);
                    }

                    document.getElementById(`mode-default`).classList.add('active');
                    currentMode = 'default';

                    document.documentElement.lang = lang;
                    document.documentElement.dir = isArabic ? 'rtl' : 'ltr';
                    updateLanguage();
                }
            } else {
                document.body.classList.remove('grayscale-mode', 'dark-mode', 'light-mode', 'bg-light', 'bg-dark');
                document.querySelectorAll('.sidebar ul li').forEach(item => item.classList.remove('active'));
                if (mode === 'dark') {
                    document.body.classList.add('dark-mode', 'bg-dark');
                } else if (mode === 'grayscale') {
                    document.body.classList.add('grayscale-mode', 'bg-light');
                } else if (mode === 'light') {
                    document.body.classList.add('light-mode', 'bg-light');
                } else {
                    document.body.classList.add('bg-light');
                }
                document.getElementById(`mode-${mode}`).classList.add('active');
                currentMode = mode;
                localStorage.setItem('accessibilityMode', mode);
                localStorage.setItem('darkMode', mode === 'dark');
            }
            if (isUserAction && mode === 'default') {
                fetchFileList();
            }
        }

        function toggleLanguage() {
            // 1. Check if it is open BEFORE doing anything else
            const detailPanel = document.getElementById('roadmap-detail');
            const isDetailOpen = detailPanel && !detailPanel.classList.contains('d-none');
            const savedRoadmap = currentActiveRoadmap; // Lock it into memory

            // 2. Switch the language variables
            lang = isArabic ? 'en' : 'ar';
            isArabic = !isArabic;
            localStorage.setItem('language', lang);
            document.documentElement.lang = lang;
            document.documentElement.dir = isArabic ? 'rtl' : 'ltr';

            // 3. Update the UI
            document.querySelectorAll('.sidebar ul li').forEach(item => item.classList.remove('active'));
            document.getElementById('language-switcher').classList.add('active');

            // This updates text and calls filterRoadmaps() (which hides the panel)
            updateLanguage();

            // 4. Instantly pop the panel back open in the new language if it was open
            if (isDetailOpen && savedRoadmap) {
                renderRoadmapDetail(savedRoadmap);
            } else if (allRoadmaps.length === 0) {
                loadRoadmaps();
            }
        }

        function updateLanguage() {
            // Dynamically update the browser tab title
            document.title = isArabic ? '  المسارات المهنية' : ' Career Paths';
            document.getElementById('title').textContent = isArabic ? 'المسارات المهنية' : 'Career paths';
            const labels = document.querySelectorAll('.sidebar ul li span');
            labels[0].textContent = isArabic ? 'الوضع الافتراضي' : 'Default Mode';
            labels[1].textContent = isArabic ? 'الوضع الرمادي' : 'Grayscale Mode';
            labels[2].textContent = isArabic ? 'الوضع الفاتح' : 'Light Mode';
            labels[3].textContent = isArabic ? 'الوضع الداكن' : 'Dark Mode';
            labels[4].textContent = isArabic ? 'English' : 'العربية';
            labels[5].textContent = isArabic ? 'زيادة الحجم' : 'Increase Size';
            labels[6].textContent = isArabic ? 'تقليل الحجم' : 'Decrease Size';
            labels[7].textContent = isArabic ? 'إعادة تعيين الحجم' : 'Reset Size';

            // Filter button texts
            const filterButtons = document.querySelectorAll('.filter-btn');
            if (filterButtons.length >= 4) {
                filterButtons[0].textContent = isArabic ? 'كل المسارات' : 'All';
                filterButtons[1].textContent = isArabic ? 'تطوير برمجيات' : 'Software';
                filterButtons[2].textContent = isArabic ? 'الذكاء الاصطناعي' : 'Artificial Intelligence';
                filterButtons[3].textContent = isArabic ? 'الأمن السيبراني' : 'Cybersecurity';
            }

            // Search input placeholder
            const searchInput = document.getElementById('search-input');
            if (searchInput) {
                searchInput.placeholder = isArabic ? 'ابحث عن مسار مهني...' : 'Search career paths...';
            }

            document.getElementById('copyright-ar').style.display = isArabic ? 'inline' : 'none';
            document.getElementById('copyright-en').style.display = isArabic ? 'none' : 'inline';

            // Re-render UI if data exists
            if (typeof allRoadmaps !== 'undefined' && allRoadmaps.length > 0) {
                filterRoadmaps();
            }
        }

        function increaseSize() {
            sizeScale = Math.min(sizeScale * 1.2, 1.5);
            document.documentElement.style.setProperty('--size-scale', sizeScale);
            localStorage.setItem('sizeScale', sizeScale);
            document.querySelectorAll('.sidebar ul li').forEach(item => item.classList.remove('active'));
            document.getElementById('size-increase').classList.add('active');
        }

        function decreaseSize() {
            sizeScale = Math.max(sizeScale / 1.2, 0.5);
            document.documentElement.style.setProperty('--size-scale', sizeScale);
            localStorage.setItem('sizeScale', sizeScale);
            document.querySelectorAll('.sidebar ul li').forEach(item => item.classList.remove('active'));
            document.getElementById('size-decrease').classList.add('active');
        }

        function resetSize() {
            sizeScale = 1;
            document.documentElement.style.setProperty('--size-scale', sizeScale);
            localStorage.setItem('sizeScale', sizeScale);
            document.querySelectorAll('.sidebar ul li').forEach(item => item.classList.remove('active'));
            document.getElementById('size-reset').classList.add('active');
        }

        async function fetchFileList() {
            // Note: This function remains as you had it for downloading files via TWK API
            const fileListDiv = document.getElementById('file-list');
            if (!fileListDiv) return; // Prevent error if file-list is removed
            fileListDiv.innerHTML = '';
            document.getElementById('loader-overlay').style.display = 'flex';

            let token = null, nationalId = null, fullNameAr = null, fullNameEn = null, appearance = null,
                status = 'success', errorMessage = null;

            try {
                // Fetch token
                const tokenResponse = await TWK.generateToken();

                if (!tokenResponse || (typeof tokenResponse === 'object' && (!tokenResponse.result || !tokenResponse.result.token))) {
                    throw new Error('Failed to generate token');
                }
                token = tokenResponse.result.token;
                //console.log(tokenResponse.result.token);

                // Fetch national ID
                const userIdResponse = await TWK.getUserId();
                if (!userIdResponse || !userIdResponse.success || !userIdResponse.result || !userIdResponse.result.user_id) {
                    throw new Error('Failed to fetch national ID');
                }
                nationalId = userIdResponse.result.user_id;

                // Fetch full name
                const fullNameResponse = await TWK.V2.getUserFullName();
                if (!fullNameResponse || !fullNameResponse.success || !fullNameResponse.result || !fullNameResponse.result.full_name_ar || !fullNameResponse.result.full_name_en) {
                    throw new Error('Failed to fetch full name');
                }
                fullNameAr = fullNameResponse.result.full_name_ar;
                fullNameEn = fullNameResponse.result.full_name_en;

                // Fetch device info for language and appearance
                const deviceInfo = await TWK.getDeviceInfo();
                if (!deviceInfo || !deviceInfo.success || !deviceInfo.result) {
                    throw new Error('Failed to fetch device info');
                }
                lang = ['ar', 'en'].includes(deviceInfo.result.app_language) ? deviceInfo.result.app_language : 'ar';
                appearance = deviceInfo.result.appearance || null;
            } catch (e) {
                status = 'error';
                errorMessage = e.message;
                console.error('Error fetching TWK data:', e.message);
            }
            let gender = '';
            try {
                const responseGender = await TWK.getUserGender();
                if (responseGender.success) {
                    gender = responseGender.result.gender;
                }
            } catch (e) {
                console.error('Failed to get user Gender:', e);
            }

            let nationality_iso = '';
            try {
                const nationality_isoResponse = await TWK.getUserNationalityISO();

                if (nationality_isoResponse && nationality_isoResponse.success && nationality_isoResponse.result) {
                    nationality_iso = nationality_isoResponse.result.nationality_iso;
                }
            } catch (e) {
                console.error('Failed to get user Nationality ISO:', e);
            }

            let nationality = '';
            try {
                const nationalityResponse = await TWK.getUserNationality();

                if (nationalityResponse && nationalityResponse.success && nationalityResponse.result) {
                    nationality = nationalityResponse.result.nationality_name;
                }
            } catch (e) {
                console.error('Failed to get user Nationality:', e);
            }

            let user_type = '';
            try {
                const user_typeResponse = await TWK.getUserType();

                if (user_typeResponse && user_typeResponse.success && user_typeResponse.result) {
                    user_type = user_typeResponse.result.user_type;
                }
            } catch (e) {
                console.error('Failed to get user Type:', e);
            }

            let mobile_number = '';
            try {
                const mobile_numberResponse = await TWK.getUserMobileNumber();

                if (mobile_numberResponse && mobile_numberResponse.success && mobile_numberResponse.result) {
                    mobile_number = mobile_numberResponse.result.mobile_number;
                }
            } catch (e) {
                console.error('Failed to get user Mobile Number:', e);
            }


            try {
                const url = `https://tawakkalnabe.bu.edu.sa/api/file-list?${new URLSearchParams({
                    token: token || '',
                    national_id: nationalId || '',
                    full_name_ar: fullNameAr || '',
                    full_name_en: fullNameEn || '',
                    language: lang || '',
                    appearance: appearance || '',
                    requester_gender: gender || '',
                    requester_nationality_iso: nationality_iso || '',
                    requester_nationality: nationality || '',
                    requester_user_type: user_type || '',
                    requester_mobile_number: mobile_number || '',
                    status: status,
                    error_message: errorMessage || ''
                }).toString()}`;

                const resp = await fetch(url);
                if (!resp.ok) throw new Error(isArabic ? 'فشل جلب القائمة' : 'Failed to fetch file list');

                const files = await resp.json();
                files.sort((a, b) => a.display_order - b.display_order);

                fileListDiv.innerHTML = '';
                files.forEach((file, idx) => {
                    const item = document.createElement('div');
                    item.className = 'file-item';
                    item.dataset.order = idx;
                    item.style.setProperty('--order', idx.toString());

                    const displayName = isArabic ? file.display_name : (file.display_name_en || file.display_name);
                    item.innerHTML = `
          <i class="fas ${file.icon || 'fa-file-pdf'}"></i>
          <div class="title" onclick="openFile('${idx}', '${sanitizeHTML(file.actual_name)}', '${sanitizeHTML(displayName)}')" role="button" tabindex="0" onkeydown="if(event.key === 'Enter' || event.key === ' ') openFile('${idx}', '${sanitizeHTML(file.actual_name)}', '${sanitizeHTML(displayName)}')">${sanitizeHTML(displayName)}</div>
        `;
                    fileListDiv.appendChild(item);
                });
            } catch (e) {
                console.error('Fetch file list error:', e.message);
                fileListDiv.innerHTML = `<div class="alert alert-danger">${sanitizeHTML(isArabic ? `خطأ: ${e.message}` : `Error: ${e.message}`)}</div>`;
            } finally {
                document.getElementById('loader-overlay').style.display = 'none';
            }
        }

        async function openFile(idx, actualName, displayName) {
            document.getElementById('loader-overlay').style.display = 'flex';
            try {
                if (!actualName || !actualName.match(/\.(pdf)$/i)) {
                    throw new Error(isArabic ? 'رابط الملف غير صالح أو ليس ملف PDF' : 'Invalid file URL or not a PDF');
                }

                let url = actualName;
                if (!url.startsWith('http://') && !url.startsWith('https://')) {
                    url = `https://tawakkalnabe.bu.edu.sa/api/download-file/${encodeURIComponent(actualName)}`;
                }

                console.log('Navigating to viewer with URL:', url);
                window.location.href = `viewer.html?pdf=${encodeURIComponent(url)}&lang=${lang}&mode=${currentMode}&size=${sizeScale}&name=${encodeURIComponent(displayName)}`;
            } catch (error) {
                console.error('Error preparing file navigation:', error.message, 'URL:', actualName);
                const fileListDiv = document.getElementById('file-list');
                if (fileListDiv) {
                    fileListDiv.innerHTML = `<div class="alert alert-danger">${sanitizeHTML(isArabic ? `تعذر فتح الملف: ${error.message}` : `Unable to open the file: ${error.message}`)}</div>`;
                }
            } finally {
                document.getElementById('loader-overlay').style.display = 'none';
            }
        }

        function handlePullToRefresh() {
            const pullToRefresh = document.getElementById('pull-to-refresh');
            const pullToRefreshContainer = pullToRefresh.querySelector('.pull-to-refresh-container');
            let isPulling = false;

            document.addEventListener('touchstart', (e) => {
                if (document.getElementById('sidebar').classList.contains('active')) return;
                if (window.scrollY === 0) {
                    touchStartY = e.touches[0].clientY;
                    isPulling = true;
                    requestAnimationFrame(() => {
                        pullToRefreshContainer.classList.add('pulling');
                    });
                }
            });

            document.addEventListener('touchmove', (e) => {
                if (!isPulling) return;
                const touchY = e.touches[0].clientY;
                pullDistance = Math.max(0, touchY - touchStartY);
                pullToRefresh.style.transform = `translateY(${pullDistance}px)`;
                e.preventDefault();
            });

            document.addEventListener('touchend', () => {
                if (!isPulling) return;
                pullToRefreshContainer.classList.remove('pulling');
                pullToRefresh.style.transform = 'translateY(0)';
                if (pullDistance >= pullThreshold) {
                    document.getElementById('loader-overlay').style.display = 'flex';
                    // We call loadRoadmaps on refresh instead of fetchFileList here
                    loadRoadmaps().finally(() => {
                        document.getElementById('loader-overlay').style.display = 'none';
                    });
                }
                isPulling = false;
                pullDistance = 0;
                touchStartY = null;
            });
        }
        // Listen for real-time OS theme changes
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
            // Only auto-update if the user's app is currently set to 'default' mode
            if (currentMode === 'default') {
                const prefersDark = event.matches;

                // Clean up old classes
                document.body.classList.remove('grayscale-mode', 'dark-mode', 'light-mode', 'bg-light', 'bg-dark');

                // Apply the new theme instantly
                if (prefersDark) {
                    document.body.classList.add('dark-mode', 'bg-dark');
                    localStorage.setItem('darkMode', true);
                } else {
                    document.body.classList.add('bg-light');
                    localStorage.setItem('darkMode', false);
                }
            }
        });

        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('sidebar').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
            document.body.classList.remove('sidebar-active');

            try {
                await waitForPdfJs();
                pdfjsLib.GlobalWorkerOptions.workerSrc = 'js/pdf.worker.min.js';
            } catch (e) {
                console.error('PDF.js failed to load:', e);
            }

            try {
                // Fetch device info to set initial language and appearance
                const device_info = await TWK.getDeviceInfo();
                if (device_info.success) {
                    lang = ['ar', 'en'].includes(device_info.result.app_language) ? device_info.result.app_language : 'ar';
                    isArabic = lang === 'ar';
                    localStorage.setItem('language', lang);
                    const appearanceMode = device_info.result.appearance === 2 ? 'dark' : 'default';
                    localStorage.setItem('accessibilityMode', appearanceMode);
                    setMode(appearanceMode);
                } else {
                    lang = 'ar';
                    isArabic = true;
                    localStorage.setItem('language', lang);
                    localStorage.setItem('accessibilityMode', 'default');
                    setMode('default');
                }

            } catch (e) {
                console.error('Failed to get device info or full name:', e);
                lang = 'ar';
                isArabic = true;
                localStorage.setItem('language', lang);
                localStorage.setItem('accessibilityMode', 'default');
                setMode('default');
            }

            // Apply saved mode if it exists to allow user override
            const savedMode = localStorage.getItem('accessibilityMode');
            if (savedMode && savedMode !== 'default') {
                setMode(savedMode);
            }

            // Apply saved size scale
            const savedSizeScale = localStorage.getItem('sizeScale');
            if (savedSizeScale) {
                sizeScale = parseFloat(savedSizeScale);
                document.documentElement.style.setProperty('--size-scale', sizeScale);
            }

            // Set document language and direction
            document.documentElement.lang = lang;
            document.documentElement.dir = isArabic ? 'rtl' : 'ltr';

            updateLanguage();
            handlePullToRefresh(); // Note: updated to refresh roadmaps instead of files
            await loadRoadmaps();

        });
    </script>
